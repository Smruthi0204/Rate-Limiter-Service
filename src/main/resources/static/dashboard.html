<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rate Limiter Dashboard</title>
    <style>
        body {
            font-family: monospace;
            background: #111;
            color: #eee;
            padding: 40px;
        }

        h1 { margin-bottom: 32px; }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }

        .card-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 36px;
            font-weight: bold;
            color: #00ff9d;
        }

        .last-updated {
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Rate Limiter Dashboard</h1>

    <div class="cards">
        <div class="card">
            <div class="card-label">Total Requests</div>
            <div class="card-value" id="totalRequests">-</div>
        </div>
        <div class="card">
            <div class="card-label">Allowed</div>
            <div class="card-value" id="allowedRequests">-</div>
        </div>
        <div class="card">
            <div class="card-label">Blocked</div>
            <div class="card-value" id="blockedRequests">-</div>
        </div>
        <div class="card">
            <div class="card-label">Active Clients</div>
            <div class="card-value" id="activeClients">-</div>
        </div>
    </div>

    <div class="last-updated" id="lastUpdated">fetching...</div>

    <script>
        function fetchMetrics() {
            fetch('/api/metrics')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('totalRequests').textContent = data.totalRequests;
                    document.getElementById('allowedRequests').textContent = data.allowedRequests;
                    document.getElementById('blockedRequests').textContent = data.blockedRequests;
                    document.getElementById('activeClients').textContent = data.activeClients;
                    document.getElementById('lastUpdated').textContent = 
                        'Last updated: ' + new Date().toLocaleTimeString();
                })
                .catch(() => {
                    document.getElementById('lastUpdated').textContent = 'Error connecting to server';
                });
        }

        fetchMetrics();
        setInterval(fetchMetrics, 3000);
    </script>
</body>
</html>
